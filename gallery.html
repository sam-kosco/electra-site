<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    /* Intentionally minimal - no design decisions made yet */
    body { color: black; background-color: white; }
    img { max-width: 100%; height: auto; }

    /* Carousel: photos sit on a shaded 5:3 stage (~80% of the window
       tall) with the arrows pinned to the stage edges. Photos wider
       than 5:3 are cropped to fill the stage exactly; taller photos
       show at full height with the shading visible on either side.
       Photo changes slide horizontally along a track. */
    #carousel { display: flex; justify-content: center; }

    #carousel-stage {
      position: relative;
      width: min(calc(80vh * 5 / 3), calc(100vw - 32px));
      aspect-ratio: 5 / 3;
      background: #e3e3e3;
      border-radius: 8px;
      /* clip, not hidden: a hidden box can still be scrolled by
         focus/find-in-page scroll-into-view, silently misaligning the
         transform-based track; clip makes the stage unscrollable. */
      overflow: hidden;   /* fallback for browsers without clip */
      overflow: clip;
    }

    #carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.45s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      #carousel-track { transition: none; }
    }

    .carousel-slide {
      flex: 0 0 100%;
      height: 100%;
    }
    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;  /* taller than 5:3: full height, shaded sides */
    }
    .carousel-slide img.crop {
      object-fit: cover;    /* wider than 5:3: crop sides to fill the stage */
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 1.8rem;
      line-height: 1;
      padding: 18px 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .carousel-arrow:hover,
    .carousel-arrow:focus-visible { background: rgba(0, 0, 0, 0.65); }
    #carousel-prev { left: 12px; }
    #carousel-next { right: 12px; }

    #carousel-counter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      padding: 3px 12px;
      font-size: 0.85rem;
      white-space: nowrap;
      user-select: none;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a> |
    <a href="gallery.html">Photo Gallery</a>
  </nav>

  <hr>

  <h1>Photo Gallery</h1>

  <!-- Carousel. Slides are built by script.js from photos.json. -->
  <div id="carousel" hidden>
    <div id="carousel-stage">
      <div id="carousel-track"></div>
      <button id="carousel-prev" class="carousel-arrow" type="button" aria-label="Previous photo">&#10094;</button>
      <button id="carousel-next" class="carousel-arrow" type="button" aria-label="Next photo">&#10095;</button>
      <span id="carousel-counter"></span>
    </div>
  </div>

  <p id="carousel-empty" hidden>No photos available.</p>

  <!-- Bump ?v= whenever script.js changes, in BOTH html files: it pins
       the script version to the page so a cached copy of one can never
       run against a newer copy of the other. -->
  <script src="script.js?v=4"></script>
</body>
</html>
